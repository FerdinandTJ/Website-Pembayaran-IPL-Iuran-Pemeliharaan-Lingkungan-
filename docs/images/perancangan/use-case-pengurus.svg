<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1090" role="img" aria-labelledby="title desc"><title id="title">Use case Pengurus EnviroPay</title><desc id="desc">Aktor di luar batas sistem terhubung ke elips tujuan. Rincian peran dan alternatif terdapat pada spesifikasi RUC.</desc><rect width="1180" height="1090" fill="white"/><g font-family="Arial, sans-serif"><text x="35" y="35" font-size="22" text-anchor="start" font-weight="bold" fill="#25312c">Diagram use case — Pengurus</text><rect x="250" y="65" width="650" height="985" rx="0" fill="white" stroke="#54615a" stroke-width="1.5"/><text x="575.0" y="93" font-size="20" text-anchor="middle" font-weight="bold" fill="#25312c">EnviroPay</text><circle cx="105" cy="502.0" r="15" fill="white" stroke="#263b31" stroke-width="2"/><line x1="105" y1="517.0" x2="105" y2="563.0" stroke="#59645e" stroke-width="1.5"/><line x1="81" y1="532.0" x2="129" y2="532.0" stroke="#59645e" stroke-width="1.5"/><line x1="105" y1="563.0" x2="81" y2="594.0" stroke="#59645e" stroke-width="1.5"/><line x1="105" y1="563.0" x2="129" y2="594.0" stroke="#59645e" stroke-width="1.5"/><text x="105" y="622.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#25312c">Pengurus</text><line x1="130" y1="532.0" x2="350" y2="145" stroke="#59645e" stroke-width="1.5"/><ellipse cx="575" cy="145" rx="225" ry="39" fill="#f8faf7" stroke="#314c3b" stroke-width="1.6"/><text x="575" y="142" font-size="17" text-anchor="middle" font-weight="normal" fill="#25312c">Kelola rumah, warga, impor dan rekening</text><text x="575" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#68756b">RUC-03</text><line x1="130" y1="532.0" x2="350" y2="250" stroke="#59645e" stroke-width="1.5"/><ellipse cx="575" cy="250" rx="225" ry="39" fill="#f8faf7" stroke="#314c3b" stroke-width="1.6"/><text x="575" y="247" font-size="17" text-anchor="middle" font-weight="normal" fill="#25312c">Terbitkan tagihan dan template</text><text x="575" y="270" font-size="12"